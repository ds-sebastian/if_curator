name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked pytest -q
        env:
          FORCE_CPU: 'true'
