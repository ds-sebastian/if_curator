[project]
name = "if-curator"
version = "0.3.0"
description = "Pick the Immich photos that train Frigate face recognition best"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "ds-sebastian" }]
keywords = ["immich", "frigate", "face-recognition", "training-data", "arcface"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=2.2.6",
    # The GPU build also runs on CPU. One ONNX Runtime package per platform, so switching
    # between GPU and CPU runs never uninstalls files the other package needs.
    "onnxruntime-gpu>=1.23.2; sys_platform != 'darwin' and (platform_machine == 'x86_64' or platform_machine == 'AMD64')",
    "onnxruntime>=1.23.2; sys_platform == 'darwin' or (platform_machine != 'x86_64' and platform_machine != 'AMD64')",
    "opencv-contrib-python-headless>=4.12.0.88",
    "pillow>=12.1.0",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "rich>=14.2.0",
]

[project.optional-dependencies]
# NVIDIA's CUDA and cuDNN libraries, so no system CUDA install is needed.
gpu = [
    "onnxruntime-gpu[cuda,cudnn]>=1.23.2; sys_platform != 'darwin' and (platform_machine == 'x86_64' or platform_machine == 'AMD64')",
]
objects = ["ultralytics>=8.3.252"]

[project.scripts]
if-curator = "if_curator.cli:main"

[project.urls]
Repository = "https://github.com/ds-sebastian/if_curator"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.9.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "if_curator/THIRD_PARTY_NOTICES.md"

[tool.uv]
# The contrib wheel provides cv2 with Frigate's LBF landmarks; don't let other wheels overwrite it.
exclude-dependencies = ["opencv-python", "opencv-python-headless"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B905"]
